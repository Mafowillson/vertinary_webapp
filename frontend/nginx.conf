server {
    listen 80;
    server_name _;

    # MAX_LESSON_FILE_SIZE_MB defaults to 1024 on the backend — nginx's own
    # 1MB default would 413 every real lesson upload without this.
    client_max_body_size 1100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # No path suffix on proxy_pass: the request URI passes through unchanged,
    # so /api/products reaches the backend as /api/products (matching the
    # "/api" prefix FastAPI registers its router under). Adding a path here
    # is the classic way to silently break every route.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/covers/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

