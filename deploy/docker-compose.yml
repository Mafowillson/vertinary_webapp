# Pins the Compose project namespace so networks/volumes/containers can't
# collide with the other Dockerized project already on this VPS, regardless
# of what directory this file is run from.
name: vertinary_webapp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` — internal-only, reachable as db:5432 within this stack.

  backend:
    image: ghcr.io/mafowillson/vertinary_webapp-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # No `ports:` — internal-only, reachable as backend:8000 within this stack.

  nginx:
    image: ghcr.io/mafowillson/vertinary_webapp-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
