name: CI/CD

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  # GHCR requires lowercase repo paths; the actual repo is Mafowillson/vertinary_webapp
  # (uppercase M), so these are hardcoded rather than derived from github.repository.
  BACKEND_IMAGE: ghcr.io/mafowillson/vertinary_webapp-backend
  FRONTEND_IMAGE: ghcr.io/mafowillson/vertinary_webapp-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      SECRET_KEY: ci-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # `python -m pytest` (not the bare `pytest` script) so the cwd (backend/)
      # is prepended to sys.path — otherwise `app` isn't importable, since
      # tests/ has no __init__.py to trigger pytest's own rootdir insertion.
      - run: python -m pytest tests

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # npm ci is strict about lockfile completeness; this tree's nested
      # esbuild (via vitest's own vite dependency) resolves to a slightly
      # different version per host platform, leaving optional cross-platform
      # entries incomplete for npm ci. npm install still uses the lockfile as
      # a strong hint but re-resolves what's missing instead of hard-failing.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The default "docker" buildx driver can't export to the GHA cache
      # (cache-to: type=gha below) — this switches to "docker-container",
      # which can.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy/docker-compose.yml"
          target: "/opt/vertinary_webapp/"
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/vertinary_webapp
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f
